metadata:
  name: "nginx-deployment"
  labels:
    app: "nginx"
apiVersion: "apps/v1"
replica: "1.0"
kind: "Deployment"
spec:
  template:
    metadata:
      labels:
        app: "nginx"
    spec:
      containers:
      - image: "nginx:latest"
        name: "nginx"
        ports:
        - containerPort: 80
  replicas: 3
  selector:
    matchLabels:
      app: "nginx"
